<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta http-equiv="cache-control" content="no-cache">
<meta charset="utf-8">

<html>

<head>
<style>
    /* Prevent a first-paint flash of the legacy, unstyled frame while the
       browser preprocesses and injects the startup stylesheets. */
    html:not(.styles-ready):not(.file-origin) #frame { visibility: hidden; }
    #boot-loading { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #35A8E0;
        color: #fff; font: 700 16px Arial, sans-serif; z-index: 99999; }
    #boot-loading-mark { width: 132px; height: 132px; background: url('assets/branding/kalananti-loading-icon-v3.png') center/contain no-repeat; }
    html.styles-ready #boot-loading, html.file-origin #boot-loading { display: none; }
</style>
<title>Kalananti - CodeJunior</title>
<link rel="icon" type="image/png" href="assets/branding/kalananti-loading-icon-v3.png">
<link rel="apple-touch-icon" href="assets/branding/kalananti-loading-icon-v3.png">
<script>
    window.scratchJrPage = 'index';
    // The browser build requires an HTTP origin for IndexedDB, synchronous
    // asset preprocessing, and the SQL.js wasm file. Avoid rendering the
    // unstyled legacy frame when someone double-clicks index.html.
    if (window.location.protocol === 'file:') {
        document.write('<style>html,body{margin:0;background:#35A8E0;font-family:Arial,sans-serif;color:#fff} .frame{display:none!important}.file-origin-warning{box-sizing:border-box;max-width:680px;margin:12vh auto;padding:40px;border-radius:20px;background:rgba(0,0,0,.18);text-align:center;line-height:1.5}.file-origin-warning h1{margin:0 0 12px;font-size:32px}.file-origin-warning code{display:inline-block;margin-top:18px;padding:10px 14px;border-radius:8px;background:rgba(0,0,0,.25);font-size:15px}</style>');
        document.write('<div class="file-origin-warning"><h1>Kalananti - CodeJunior</h1><p>Aplikasi tidak bisa dijalankan langsung dari file <code>file://</code> karena browser memblokir storage dan pemuatan asset.</p><p>Jalankan web build melalui server lokal atau buka URL deployment GitHub Pages.</p><code>cd web &amp;&amp; python3 -m http.server 4173</code></div>');
        window.__scratchJrFileOrigin = true;
        document.documentElement.classList.add('file-origin');
    }
</script>
<link rel="stylesheet" type="text/css" href="css/motion.css?v=kalananti-motion-animations-20260905">
<script src='dist/webClient.js?v=kalananti-motion-animations-20260905'></script>
<script type="text/javascript" src="dist/app.bundle.js?v=kalananti-motion-animations-20260905"></script>
</head>
<body style="margin:0px; background: #35A8E0;">
    <div id="boot-loading" aria-live="polite"><div id="boot-loading-mark"></div><div>Memuat Kalananti - CodeJunior…</div></div>
    <div class="frame" id="frame">
        <div class="topbar" id="topbar">
            <div class="topbar-button" id="topbar-info"></div>
            <div class="topbar-button" id="topbar-settings"></div>
            <div class="topbar-button" id="topbar-moreapps">

            </div>
        </div>
        <div class="gear hide" id="gear"></div>
        <div class="credits hide" id="authors"></div>
        <div class="creditsText hide" id="authorsText">
            <div class="creditsPanel">
                <div class="creditsTitle">KALANANTI - CODEJUNIOR</div>
                <div class="creditsSubtitle">Internal Creative Coding Environment</div>
                <div class="creditsBody">Independent Kalananti - CodeJunior build.<br>Legal and third-party information is available in the Help menu.</div>
            </div>
        </div>
        <div class="rays" id="rays"></div>
        <div class="catface" id="catface"></div>
        <div class="jrlogo" id="jrlogo"></div>
        <div class="purple hide" id="purpleguy"></div>
        <div class="red hide" id="redguy"></div>
        <div class="blue hide" id="blueguy"></div>

        <div class="startButton hide" id="startButton"></div>
        <div class="pbschars hide" id="pbschars"></div>

        <div class="gettings hide" id="gettings"></div>
        <div class="startcode hide" id="startcode"></div>
        
        <div class="usageQuestion hide" id="usageQuestion"></div>
        <div class="usageSchool hide" id="usageSchool">
            <img class="usageIcon" id="useSchoolIcon" src="assets/start/schoolIcon.svg" />
            <div class="usageText" id="useSchoolText"></div>
        </div>
        <div class="usageHome hide" id="usageHome">
            <img class="usageIcon" id="useHomeIcon" src="assets/start/homeIcon.svg" />
            <div class="usageText" id="useHomeText"></div>
        </div>
        <div class="usageOther hide" id="usageOther">
            <img class="usageIcon" id="useOtherIcon" src="assets/start/otherIcon.svg" />
            <div class="usageText" id="useOtherText"></div>
        </div>
        <div class="usageNoanswer hide" id="usageNoanswer">
            <div class="usageNoanswerText" id="usageNoanswerText"></div>
        </div>
    </div>
</body>
</html>
